<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoonLightServers</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient background blobs for the liquid-glass glow -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <!-- Top bar -->
  <header class="topbar glass">
    <div class="brand">
      <div class="logo">🌙</div>
      <h1>MoonLightServers</h1>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Search servers..." />
    </div>
  </header>

  <!-- Main 3-column layout -->
  <main class="layout">

    <!-- LEFT: Featured servers -->
    <aside class="featured-col">
      <div class="featured-box glass">
        <h3 class="featured-heading">★ Featured</h3>
        <div id="featuredList" class="featured-list">
          <!-- Featured mini-cards injected by JS -->
        </div>
      </div>
    </aside>

    <!-- CENTER: Server list -->
    <section class="list-col">
      <div class="list-header glass">
        <h2>Server List</h2>
        <span id="resultCount" class="count"></span>
      </div>
      <div id="serverList" class="server-list">
        <!-- Server cards injected by JS -->
      </div>
    </section>

    <!-- RIGHT: Filters -->
    <aside class="tags-col">
      <div class="tags-box glass">
        <h3>Filters</h3>

        <div class="filter-group">
          <label>Version</label>
          <!-- Typeable combobox -->
          <div class="combo" id="versionCombo">
            <input id="versionInput" type="text" placeholder="Any version" autocomplete="off" />
            <button class="combo-arrow" id="versionArrow" aria-label="Toggle list">▾</button>
            <div class="combo-list" id="versionList"></div>
          </div>
        </div>

        <div class="filter-group">
          <label>Status</label>
          <div id="statusTags" class="tag-list"></div>
        </div>

        <button id="clearFilters" class="clear-btn">Clear Filters</button>
      </div>
    </aside>

  </main>

  <!-- Floating Join button (bottom right) -->
  <button id="joinBtn" class="join-btn">Join</button>

  <!-- Join modal -->
  <div id="joinModal" class="modal-overlay" hidden>
    <div class="modal glass">
      <button id="modalClose" class="modal-close" aria-label="Close">✕</button>
      <h2 class="modal-title">Add Your Server</h2>
      <p class="modal-text">
        Join the Discord to add your server to the server list for <strong>free</strong>!
        <br /><br />
        Or pay to get added as a <strong>Featured</strong> server!
      </p>
      <div class="discord-embed">Link Not Added</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
